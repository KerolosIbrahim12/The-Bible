<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة الكتاب المقدس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0e;--card:#14151c;--card-2:#1b1d26;--border:rgba(255,255,255,.07);--border-soft:rgba(255,255,255,.05);--gold:#F3BD3E;--gold-soft:rgba(243,189,62,.15);--text:#f2f2f4;--muted:#8b8f9c;--green:#2FBE79;--green-soft:rgba(47,190,121,.14);--red:#EF5A6D;--red-soft:rgba(239,90,109,.14);--yellow:#EEDA3C;--shadow:0 12px 34px rgba(0,0,0,.5);}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:radial-gradient(ellipse 900px 400px at 50% -8%, rgba(243,189,62,.10), transparent 60%),var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
#app{max-width:1180px;margin:0 auto;padding:24px 20px 70px;}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);transition:.15s;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.pill-badge{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:9px 18px;font-size:13.5px;font-weight:700;}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.page-title{font-weight:800;font-size:26px;color:var(--gold);}
.hero{padding:56px 10px 8px;text-align:center;}
.logo-badge{width:84px;height:84px;margin:0 auto 26px;border-radius:24px;background:linear-gradient(145deg, var(--card), var(--bg));border:1px solid rgba(243,189,62,.3);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(243,189,62,.15);}
.hero h1{font-weight:900;font-size:clamp(30px,5.4vw,46px);margin:0 0 28px;}
.home-actions{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.home-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border-radius:14px;font-weight:800;font-size:16.5px;border:1px solid var(--border);transition:all .2s;}
.home-btn:active{transform:scale(.98);}
.home-btn.primary{background:var(--gold);color:#171205;border:none;box-shadow:0 4px 14px rgba(243,189,62,.25);}
.home-btn.primary:hover{filter:brightness(1.08);transform:translateY(-2px);}
.home-btn.secondary{background:var(--card);color:var(--text);}
.home-btn.secondary:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px);}
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px;}
.panel-title{font-weight:800;font-size:19px;color:var(--gold);}
.panel-note{font-size:13px;color:var(--muted);}
.chip-row{display:flex;gap:10px;flex-wrap:wrap;}
.chip{background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:11px 22px;border-radius:12px;font-weight:800;font-size:14.5px;}
.chip.sel{background:var(--gold);color:#171205;border-color:var(--gold);}
.team-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:20px;}
.team-card{background:var(--card-2);border:2px solid var(--border);border-radius:14px;padding:20px;display:flex;align-items:center;gap:14px;}
.team-card .tnum{font-weight:900;font-size:18px;}
.team-card .dot-lg{width:18px;height:18px;border-radius:50%;flex-shrink:0;}
.start-btn{width:100%;background:var(--gold);color:#171205;border:none;padding:18px;border-radius:14px;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
.start-btn:hover{filter:brightness(1.08);transform:translateY(-2px);}
.start-btn:active{transform:scale(.98);}
.gtopbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.gtopbar .icons{display:flex;gap:10px;}
.score-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.score-card{flex:1;min-width:150px;background:var(--card);border:2px solid var(--border-soft);border-radius:16px;padding:14px 16px;transition:.2s;}
.score-card.turn{box-shadow:0 0 0 1px var(--tcolor), 0 0 26px -6px var(--tcolor);}
.score-card .tname{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;margin-bottom:6px;}
.score-card .tscore{font-size:26px;font-weight:900;}
.score-card .tprog{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6;}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block;}
.next-turn-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:50px 30px;text-align:center;}
.next-turn-eyebrow{color:var(--muted);font-size:15px;margin-bottom:8px;}
.next-turn-team{font-weight:900;font-size:36px;color:var(--gold);margin-bottom:22px;}
.pending-double-badge{display:inline-block;background:var(--gold-soft);color:var(--gold);padding:10px 20px;border-radius:999px;font-weight:800;font-size:14px;border:1px solid var(--gold);margin-bottom:26px;animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.65;}}
.next-turn-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.next-turn-actions .start-btn{max-width:260px;width:auto;padding:16px 28px;}
.double-btn{background:linear-gradient(135deg,#F3BD3E,#F5A623)!important;color:#171205!important;}
.qcard-main{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 30px;}
.qhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:26px;}
.qhead-left{font-size:14px;color:var(--muted);}
.qhead-left b{color:var(--text);}
.qhead-badges{display:flex;gap:10px;flex-wrap:wrap;}
.badge{border-radius:999px;padding:7px 16px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;}
.badge.cat{background:var(--card-2);border:1px solid var(--border);color:var(--text);}
.badge.diff{border:1px solid;}
.badge.dbl{background:linear-gradient(135deg,#F3BD3E,#F5A623);color:#171205;border:none;}
.badge.mc{background:rgba(167,139,250,.18);color:#A78BFA;border:1px solid #A78BFA;}
.qtext{font-weight:800;font-size:clamp(20px,3.2vw,28px);text-align:center;line-height:1.7;margin:10px 0 26px;}
.action-choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:30px;}
.action-btn{padding:16px 32px;border-radius:14px;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;border:1px solid;}
.action-btn.reveal{background:var(--card-2);color:var(--gold);border-color:var(--gold);}
.action-btn.reveal:hover{background:var(--gold-soft);transform:translateY(-2px);}
.action-btn.mc{background:rgba(167,139,250,.10);color:#A78BFA;border-color:#A78BFA;}
.action-btn.mc:hover{background:rgba(167,139,250,.20);transform:translateY(-2px);}
.action-btn .sub{display:block;font-size:11.5px;opacity:.75;font-weight:600;margin-top:2px;}
.action-btn .inner{display:flex;flex-direction:column;align-items:center;line-height:1.3;}
.atext-box{background:var(--green-soft);border:1px solid rgba(47,190,121,.3);border-radius:16px;padding:20px;text-align:center;margin-bottom:26px;}
.atext-box .alabel{color:var(--green);font-weight:800;font-size:13px;margin-bottom:8px;}
.atext-box .aval{font-weight:800;font-size:19px;}
.judge-row{display:flex;gap:14px;flex-wrap:wrap;}
.judge-btn{flex:1;min-width:200px;border:none;border-radius:14px;padding:20px;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;}
.judge-btn.wrong{background:var(--red);color:#2a0007;}
.judge-btn.correct{background:var(--green);color:#04170c;}
.mc-hint{text-align:center;color:#A78BFA;font-size:13.5px;margin-bottom:18px;font-weight:700;padding:10px 16px;background:rgba(167,139,250,.08);border-radius:10px;border:1px dashed rgba(167,139,250,.35);}
.mc-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 22px;}
@media(max-width:640px){.mc-choices{grid-template-columns:1fr;}}
.mc-choice{background:var(--card-2);border:2px solid var(--border);color:var(--text);padding:16px 18px;border-radius:14px;font-weight:700;font-size:15.5px;text-align:right;transition:all .15s;line-height:1.55;display:flex;align-items:center;gap:12px;}
.mc-choice:not(:disabled):hover{border-color:#A78BFA;transform:translateY(-2px);}
.mc-choice.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);}
.mc-choice.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red);}
.mc-choice:disabled{cursor:default;transform:none;opacity:.85;}
.mc-choice.correct:disabled,.mc-choice.wrong:disabled{opacity:1;}
.mc-letter{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--border);font-weight:800;font-size:13px;flex-shrink:0;}
.bank-toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.bank-toolbar input,.bank-toolbar select{background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:12px;font-family:inherit;font-size:14px;outline:none;}
.bank-toolbar input{flex:1;min-width:220px;}
.bank-toolbar input:focus,.bank-toolbar select:focus{border-color:var(--gold);}
.bank-count{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;position:relative;}
.qcard .badges{display:flex;justify-content:space-between;margin-bottom:12px;}
.qcard .qq{font-weight:800;font-size:15px;margin-bottom:10px;line-height:1.6;}
.qcard .aa-box{background:var(--green-soft);border-radius:10px;padding:10px 14px;color:var(--green);font-weight:700;font-size:13.5px;}
.qcard .del{position:absolute;top:10px;left:12px;background:transparent;border:none;color:var(--muted);font-size:16px;opacity:0;transition:.15s;}
.qcard:hover .del{opacity:1;}
.qcard .del:hover{color:var(--red);}
.empty-state{text-align:center;padding:50px 10px;color:var(--muted);}
.field{margin-bottom:16px;}
.field input,.field textarea{width:100%;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:12px;font-family:inherit;font-size:14.5px;outline:none;}
.field input:focus{border-color:var(--gold);}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.form-row select{background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-family:inherit;font-size:13.5px;flex:1;min-width:160px;}
.diff-choice{flex:1;min-width:90px;background:var(--card-2);border:1px solid var(--border);color:var(--muted);padding:11px;border-radius:10px;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px;}
.diff-choice.sel{background:var(--gold);color:#171205;border-color:var(--gold);}
.addcat-row{display:flex;gap:12px;align-items:stretch;}
.addcat-row input{flex:1;background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:13px 15px;border-radius:12px;font-family:inherit;font-size:14.5px;outline:none;}
.addcat-row input:focus{border-color:var(--gold);}
.addcat-row button{background:var(--gold);color:#171205;border:none;padding:0 26px;border-radius:12px;font-weight:800;font-size:14.5px;}
.results-list{display:flex;flex-direction:column;gap:12px;margin:20px 0;}
.result-row{display:flex;align-items:center;gap:16px;background:var(--card-2);border:1px solid var(--border);border-radius:14px;padding:16px 20px;}
.result-row.first{border-color:var(--gold);box-shadow:0 0 24px rgba(243,189,62,.18);}
.rank{font-weight:900;font-size:22px;color:var(--gold);width:30px;}
.result-row .rname{flex:1;font-weight:800;}
.result-row .rscore{font-weight:900;font-size:22px;color:var(--gold);}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--gold);color:#171205;padding:12px 26px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:var(--shadow);z-index:100;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ ICONS ============ */
const ICO={home:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>`,refresh:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>`,expand:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`,play:`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>`,bars:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 18V9M12 18V5M18 18v-5"/></svg>`,filePlus:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg>`,cross:`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M5 8h14"/></svg>`,check:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,x:`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,back:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,zap:`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>`,eye:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`,list:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>`};

/* ============ DATA ============ */
const STORAGE_KEY='bba_user_mods_v1';
const DIFF_META={easy:{label:'سهل',points:100,color:'var(--green)'},medium:{label:'متوسط',points:200,color:'var(--yellow)'},hard:{label:'صعب',points:300,color:'var(--red)'}};
const SEED_CATEGORIES=[{id:'c1',name:'العهد القديم',icon:'📖'},{id:'c2',name:'العهد الجديد',icon:'✝️'},{id:'c3',name:'الأسفار',icon:'📚'},{id:'c4',name:'آيات الكتاب المقدس',icon:'📜'},{id:'c5',name:'من أنا؟',icon:'👤'},{id:'c6',name:'من القائل؟',icon:'💬'}];
function mk(cat,diff,q,a,choices){return{cat,diff,points:DIFF_META[diff].points,q,a,choices};}

const SEED_QUESTIONS_RAW=[
// ===== c1 العهد القديم =====
mk('c1','easy','من هو أول إنسان خلقه الله؟','آدم',['نوح','إبراهيم','موسى']),
mk('c1','easy','من هو النبي الذي أخرج بني إسرائيل من مصر؟','موسى',['هارون','يشوع','إبراهيم']),
mk('c1','easy','من هو الملك الذي بنى الهيكل الأول في أورشليم؟','سليمان',['داود','حزقيا','يوشيا']),
mk('c1','easy','من هو الفتى الراعي الذي قتل جليات الجبار بالمقلاع؟','داود',['شاول','يوناثان','صموئيل']),
mk('c1','easy','كم يوماً وليلة استمر المطر في طوفان نوح؟','40 يوماً وليلة',['7 أيام','100 يوم','120 يوماً']),
mk('c1','easy','ما اسم البحر الذي شقّه الله لبني إسرائيل؟','البحر الأحمر',['بحر الجليل','البحر الميت','البحر المتوسط']),
mk('c1','easy','من هي أول امرأة في الكتاب المقدس؟','حواء',['سارة','راحيل','مريم']),
mk('c1','easy','ما اسم الجبل الذي تسلّم عليه موسى الوصايا العشر؟','جبل سيناء',['جبل الكرمل','جبل نيبو','جبل الزيتون']),
mk('c1','easy','من هو أبو جميع الأمم المؤمنة؟','إبراهيم',['إسحاق','يعقوب','نوح']),
mk('c1','easy','من هو أول قاتل في التاريخ البشري؟','قايين',['هابيل','لامك','يوسف']),
mk('c1','easy','من هي زوجة إبراهيم وأم إسحاق؟','سارة',['رفقة','راحيل','حواء']),
mk('c1','easy','من هو والد يوسف الصديق؟','يعقوب',['إسحاق','إبراهيم','هارون']),
mk('c1','easy','من هو أول ملك على إسرائيل؟','شاول',['داود','صموئيل','يربعام']),
mk('c1','easy','من هو والد نوح؟','لامك',['متوشالح','شيث','حنوخ']),
mk('c1','medium','كم سنة تاه بنو إسرائيل في البرية؟','40 سنة',['70 سنة','12 سنة','400 سنة']),
mk('c1','medium','من هو النبي الذي صعد إلى السماء في مركبة نارية؟','إيليا',['أليشع','إشعياء','حزقيال']),
mk('c1','medium','ما اسم الملكة التي زارت سليمان لاختبار حكمته؟','ملكة سبأ',['إيزابل','أستير','دليلة']),
mk('c1','medium','من هو الملك الذي رأى أصابع يد تكتب على الحائط؟','بلشاصر',['نبوخذ نصر','دارا المادي','كورش']),
mk('c1','medium','من هي المرأة التي خبّأت جاسوسي إسرائيل في أريحا؟','راحاب',['دبورة','إيزابل','راعوث']),
mk('c1','medium','من هو الكاهن الذي بارك إبراهيم بالخبز والخمر؟','ملكي صادق',['هارون','عالي الكاهن','صادوق']),
mk('c1','medium','كم كان عمر آدم عندما مات؟','930 سنة',['969 سنة','777 سنة','120 سنة']),
mk('c1','medium','ما اسم النهر الذي جفّ ليعبر بنو إسرائيل إلى كنعان؟','نهر الأردن',['نهر النيل','نهر الفرات','نهر دجلة']),
mk('c1','medium','من هو الكاهن الذي ربّى صموئيل في الهيكل؟','عالي الكاهن',['صادوق','ملكي صادق','هارون']),

/* ============ SEED IDs & STORAGE ============ */
function seedWithIds(){return SEED_QUESTIONS_RAW.map((q,i)=>({id:'q'+(i+1),...q}));}

function loadData(){
  const seedQuestions = seedWithIds();
  const seedCategories = SEED_CATEGORIES.slice();
  let userData={addedQuestions:[],deletedIds:[],addedCategories:[]};
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p=JSON.parse(raw);
      userData.addedQuestions=p.addedQuestions||[];
      userData.deletedIds=p.deletedIds||[];
      userData.addedCategories=p.addedCategories||[];
    }
  }catch(e){}
  const deletedSet=new Set(userData.deletedIds);
  const questions=seedQuestions.filter(q=>!deletedSet.has(q.id));
  questions.push(...userData.addedQuestions);
  const categories=[...seedCategories,...userData.addedCategories];
  return{categories,questions};
}

function saveData(d){
  const seedIds=new Set(SEED_QUESTIONS_RAW.map((_,i)=>'q'+(i+1)));
  const seedCatIds=new Set(SEED_CATEGORIES.map(c=>c.id));
  const addedQuestions=d.questions.filter(q=>!seedIds.has(q.id));
  const existingIds=new Set(d.questions.map(q=>q.id));
  const deletedIds=[...seedIds].filter(id=>!existingIds.has(id));
  const addedCategories=d.categories.filter(c=>!seedCatIds.has(c.id));
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({addedQuestions,deletedIds,addedCategories}));
  }catch(e){}
}

/* ============ HELPERS ============ */
function escapeHtml(str){return String(str).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cleanAnswer(s){return String(s).replace(/\s*[\(（][^\)）]*[\)）]\s*$/,'').replace(/\s*[-–—]\s*(تك|خر|لا|عد|تث|يش|قض|را|1 صم|2 صم|1 مل|2 مل|1 أخ|2 أخ|عز|نح|أس|أي|مز|أم|جا|نش|إش|إر|مرا|حز|دا|هو|يوء|عا|عو|يون|مي|نا|حب|صف|حج|زك|ملا|مت|مر|لو|يو|اع|رو|1 كو|2 كو|غل|أف|في|كو|1 تس|2 تس|1 تي|2 تي|تي|فل|عب|يع|1 بط|2 بط|1 يو|2 يو|3 يو|يه|رؤ|صم|مل|أخ|صم|ملوك|أيام|كورنثوس|تسالونيكي|تيموثاوس|بطرس|يوحنا)[^\s]*\s*$/,'').trim();}

// ===== توليد الاختيارات بشكل منطقي =====
function generateChoices(q, count=4){
  const correctClean = cleanAnswer(q.a);

  // لو السؤال معاه اختيارات خاصة به (يدوية ومنطقية) استخدمها مباشرة
  if(Array.isArray(q.choices) && q.choices.length>0){
    const manualDistractors = q.choices.slice(0, count-1);
    return shuffle([correctClean, ...manualDistractors]);
  }

  const qt = q.q;
  let pool = null;

  // أسئلة "من أنا" و "من القائل" → أسماء أشخاص
  if(/من أنا|من القائل/.test(qt)){
    if(q.cat === 'c1') pool = POOLS.people_ot;
    else if(q.cat === 'c2') pool = POOLS.people_nt;
    else if(q.cat === 'c6') pool = POOLS.people_all;
    else pool = POOLS.people_all;
  }
  // أسئلة "من هو/هي/والد/أخو..." → أشخاص
  else if(/^من (هو|هي|أخو|والد|والدة|جد|أم|أب|الذي|التي|هما)/.test(qt) || /من هو|من هي|من هما/.test(qt)){
    if(q.cat === 'c1') pool = POOLS.people_ot;
    else if(q.cat === 'c2') pool = POOLS.people_nt;
    else pool = POOLS.people_all;
  }
  // أسئلة "كم..." → أرقام
  else if(/^كم /.test(qt) || /كم (عدد|يوماً|سنة|مزمور|أصحاح|رسالة|سفر|نبيّ|مرة|كان|سفراً)/.test(qt)){
    pool = POOLS.numbers;
  }
  // أسئلة عن الأسفار
  else if(/من أي سفر|^ما (هو|هي) (أول|آخر|أطول|أقصر)|^ما اسم السفر|^ما عدد الأسفار|^ما السفر|^ما هي (أطول|أقصر|أول|آخر)|^كم عدد رسائل|^من كتب|^من هو كاتب|^ما هو أول سفر|^ما هو آخر سفر/.test(qt)){
    pool = POOLS.books;
  }
  // أسئلة "في أي مدينة/قرية/جبل/نهر/جزيرة/مكان"
  else if(/في أي (مدينة|قرية|مكان|جبل|نهر|بحر|جزيرة|أرض)|من أي (مكان|مدينة|قرية)|ما اسم (البحر|الجبل|النهر|المكان|الجزيرة|المغارة|الحقل|الملكة)/.test(qt)){
    if(q.cat === 'c1') pool = POOLS.places_ot;
    else if(q.cat === 'c2') pool = POOLS.places_nt;
    else pool = POOLS.places_all;
  }
  // أسئلة "أكمل"
  else if(/^أكمل/.test(qt)){
    pool = POOLS.verse;
  }

  // لو مفيش بنك مناسب، استخدم إجابات نفس الفئة
  if(!pool){
    pool = DB.questions.filter(x => x.id !== q.id && x.cat === q.cat).map(x => cleanAnswer(x.a));
  }

  // فلترة الإجابات المكررة
  const correctVariants = [q.a, correctClean].map(s => s.trim());
  let filtered = [...new Set(pool.map(a => cleanAnswer(a)))].filter(a => {
    return a && !correctVariants.includes(a);
  });

  let distractors = shuffle(filtered).slice(0, count-1);

  // لو مش كفاية من نفس الفئة
  if(distractors.length < count-1){
    const catPool = DB.questions.filter(x => x.id !== q.id && x.cat === q.cat).map(x => cleanAnswer(x.a));
    const extra = [...new Set(catPool)].filter(a => a && !correctVariants.includes(a) && !distractors.includes(a));
    distractors.push(...shuffle(extra).slice(0, count-1-distractors.length));
  }

  // لو لسه مش كفاية، من كل الفئات
  if(distractors.length < count-1){
    const globalPool = DB.questions.filter(x => x.id !== q.id).map(x => cleanAnswer(x.a));
    const globalUnique = [...new Set(globalPool)].filter(a => a && !correctVariants.includes(a) && !distractors.includes(a));
    distractors.push(...shuffle(globalUnique).slice(0, count-1-distractors.length));
  }

  // لو لسه، نستخدم أي إجابات متاحة
  if(distractors.length < count-1){
    const fallback = ['موسى','داود','بطرس','بولس','40','بيت لحم','أورشليم','التكوين'];
    for(const f of fallback){
      if(distractors.length >= count-1) break;
      if(!correctVariants.includes(f) && !distractors.includes(f)) distractors.push(f);
    }
  }

  return shuffle([correctClean, ...distractors]);
}

/* ============ GAME LOGIC ============ */
function generateStages(count){
  let arr=[];
  let easyCount=Math.ceil(count*0.35);
  let hardCount=Math.floor(count*0.30);
  let medCount=count-easyCount-hardCount;
  for(let i=0;i<easyCount;i++)arr.push('easy');
  for(let i=0;i<medCount;i++)arr.push('medium');
  for(let i=0;i<hardCount;i++)arr.push('hard');
  return arr;
}
function beginGame(){
  state.usedIds=new Set();state.currentTeamIndex=0;state.answered={};
  state.teams.forEach(t=>{t.score=0;t.doubleUsed=false;t.hasPendingDouble=false;state.answered[t.id]=0;});
  state.stages=generateStages(state.perTeam);
  state.view='nextTurn';render();
}

      <button class="start-btn" onclick="openCurrentQuestion(false)">${ICO.play} اعرض السؤال</button>
      ${canUseDouble?`<button class="start-btn double-btn" onclick="openCurrentQuestion(true)">${ICO.zap} العب بالدبل (x2)</button>`:''}
    </div>
  </div>`;
}

function openCurrentQuestion(useDouble){
  const t=currentTeam();
  const qIndex=state.answered[t.id]||0;
  const targetDiff=state.stages[qIndex]||'easy';
  let pool=DB.questions.filter(q=>q.diff===targetDiff&&!state.usedIds.has(q.id));
  if(pool.length===0)pool=DB.questions.filter(q=>!state.usedIds.has(q.id));
  if(pool.length===0){state.view='results';render();return;}
  const q=pool[Math.floor(Math.random()*pool.length)];
  state.activeQuestion=q;
  state.showAnswer=false;state.useMC=false;state.mcChoices=null;state.mcSelected=null;
  state.doubleActive=false;state.doubleSource=null;
  if(t.hasPendingDouble){state.doubleActive=true;state.doubleSource='transferred';}
  else if(useDouble&&!t.doubleUsed){state.doubleActive=true;state.doubleSource='own';t.doubleUsed=true;}
  state.view='question';render();
}

function renderQuestion(){
  const q=state.activeQuestion;
  const t=currentTeam();
  const cat=DB.categories.find(c=>c.id===q.cat)||{name:'عام',icon:'❓'};
  const diffMeta=DIFF_META[q.diff];
  let pointsPreview=q.points;
  if(state.useMC)pointsPreview=Math.floor(pointsPreview/2);
  if(state.doubleActive)pointsPreview*=2;
  let bodyHtml='';
  if(state.useMC)bodyHtml=renderMCChoices(q);
  else if(state.showAnswer)bodyHtml=renderAnswerReveal(q);
  else bodyHtml=renderActionChoices();
  return `${gameTopBar()}
  <div class="qcard-main">
    <div class="qhead">
      <div class="qhead-left">السؤال موجّه إلى: <b style="color:${t.color}">${escapeHtml(t.name)}</b></div>
      <div class="qhead-badges">
        <span class="badge cat">${cat.icon} ${escapeHtml(cat.name)}</span>
        <span class="badge diff" style="border-color:${diffMeta.color};color:${diffMeta.color}">${diffMeta.label} · ${pointsPreview} نقطة${state.useMC?' (نصف)':''}</span>
        ${state.doubleActive?`<span class="badge dbl">${ICO.zap} دبل x2${state.doubleSource==='transferred'?' (مُحوَّل)':''}</span>`:''}
        ${state.useMC?`<span class="badge mc">${ICO.list} وضع الاختيارات</span>`:''}
      </div>
    </div>
    <div class="qtext">${escapeHtml(q.q)}</div>
    ${bodyHtml}
  </div>`;
}

function renderActionChoices(){
  return `<div class="action-choices">
    <button class="action-btn reveal" onclick="revealAnswer()"><span class="inner">${ICO.eye}<span>عرض الإجابة المباشر</span></span></button>
    <button class="action-btn mc" onclick="startMC()"><span class="inner">${ICO.list}<span>استخدام الاختيارات</span><span class="sub">النقاط ستنخفض للنصف</span></span></button>
  </div>`;
}

function renderAnswerReveal(q){
  let pts=q.points;
  if(state.useMC)pts=Math.floor(pts/2);
  if(state.doubleActive)pts*=2;
  return `<div class="atext-box"><div class="alabel">الإجابة الصحيحة</div><div class="aval">${escapeHtml(q.a)}</div></div>
  <div class="judge-row">
    <button class="judge-btn wrong" onclick="judgeAnswer(false)">${ICO.x} خطأ</button>
    <button class="judge-btn correct" onclick="judgeAnswer(true)">${ICO.check} صح (${pts} نقطة)</button>
  </div>`;
}

function renderMCChoices(q){
  const selected=state.mcSelected;
  const revealed=selected!==null;
  let pts=Math.floor(q.points/2);
  if(state.doubleActive)pts*=2;
  return `<div class="mc-hint">🎯 اختر الإجابة الصحيحة — نقاط هذا السؤال: ${pts} (بدلاً من ${q.points*(state.doubleActive?2:1)})</div>
  <div class="mc-choices">${state.mcChoices.map((choice,idx)=>{
    const isCorrect=choice===cleanAnswer(q.a);
    const isSelected=selected===idx;
    let cls='mc-choice';
    if(revealed&&isCorrect)cls+=' correct';
    else if(revealed&&isSelected&&!isCorrect)cls+=' wrong';
    const letter=['أ','ب','ج','د'][idx]||(idx+1);
    return `<button class="${cls}" ${revealed?'disabled':''} onclick="selectMCChoice(${idx})">
      <span class="mc-letter">${letter}</span><span>${escapeHtml(choice)}</span>
    </button>`;
  }).join('')}</div>
  ${revealed?`<div style="margin-top:18px;"><button class="start-btn" onclick="continueAfterMC()">${ICO.play} متابعة للدور التالي</button></div>`:''}`;
}

function revealAnswer(){state.showAnswer=true;render();}
function startMC(){state.useMC=true;state.mcChoices=generateChoices(state.activeQuestion);state.mcSelected=null;render();}
function selectMCChoice(idx){
  if(state.mcSelected!==null)return;
  state.mcSelected=idx;
  const isCorrect=state.mcChoices[idx]===cleanAnswer(state.activeQuestion.a);
  applyAnswer(isCorrect);render();
}
function continueAfterMC(){advanceTurn();}
function judgeAnswer(isCorrect){applyAnswer(isCorrect);advanceTurn();}

function applyAnswer(isCorrect){
  const q=state.activeQuestion;
  const t=currentTeam();
  state.usedIds.add(q.id);
  state.answered[t.id]=(state.answered[t.id]||0)+1;
  let pts=q.points;
  if(state.useMC)pts=Math.floor(pts/2);
  if(state.doubleActive)pts*=2;
  if(isCorrect){t.score+=pts;}
  else if(state.doubleActive&&state.doubleSource==='own'&&state.teams.length>1){
    const nextIdx=(state.currentTeamIndex+1)%state.teams.length;
    state.teams[nextIdx].hasPendingDouble=true;
  }
  if(t.hasPendingDouble)t.hasPendingDouble=false;
}

function advanceTurn(){
  const totalPerTeam=state.perTeam;
  const allFinished=state.teams.every(tm=>(state.answered[tm.id]||0)>=totalPerTeam);
  if(allFinished){state.view='results';render();return;}
  if(state.teams.length>1)state.currentTeamIndex=(state.currentTeamIndex+1)%state.teams.length;
  state.activeQuestion=null;state.useMC=false;state.mcChoices=null;state.mcSelected=null;
  state.showAnswer=false;state.doubleActive=false;state.doubleSource=null;
  state.view='nextTurn';render();
}

/* ============ RESULTS ============ */
function renderResults(){
  const sorted=[...state.teams].sort((a,b)=>b.score-a.score);
  const maxScore=sorted[0].score;
  const isSolo=state.teams.length===1;
  return `<div class="topline"><button class="back-btn" onclick="goHome()">الرئيسية ${ICO.home}</button><div class="page-title">${isSolo?'النتيجة النهائية':'نتائج المسابقة النهائية'}</div></div>
  <div class="panel" style="text-align:center;padding:40px 20px;">
    <div style="font-size:46px;margin-bottom:10px;">🏆</div>
    ${isSolo?`<div style="font-weight:900;font-size:28px;color:var(--gold);margin-bottom:6px;">أحسنت يا ${escapeHtml(sorted[0].name)}!</div><div style="color:var(--muted);font-size:15px;margin-bottom:30px;">مجموع نقاطك النهائي: <b style="color:var(--gold);font-size:20px;">${sorted[0].score} نقطة</b></div>`:`<div style="font-weight:900;font-size:28px;color:var(--gold);margin-bottom:6px;">مبروك لـ ${escapeHtml(sorted[0].name)} الفوز!</div><div style="color:var(--muted);font-size:15px;margin-bottom:30px;">انتهت المسابقة بنجاح وحصد المركز الأول بجدارة</div>`}
    <div class="results-list" style="max-width:600px;margin:0 auto;">${sorted.map((tm,i)=>{
      const isFirst=tm.score===maxScore;
      return `<div class="result-row ${isFirst?'first':''}"><div class="rank">#${i+1}</div><div class="rname" style="text-align:right;display:flex;align-items:center;gap:10px;"><span class="dot" style="background:${tm.color}"></span>${escapeHtml(tm.name)}</div><div class="rscore">${tm.score} نقطة</div></div>`;
    }).join('')}</div>
    <div style="margin-top:35px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
      <button class="home-btn primary" onclick="goSetup()" style="padding:14px 28px;">${ICO.refresh} مسابقة جديدة</button>
      <button class="home-btn secondary" onclick="goHome()" style="padding:14px 28px;">الرئيسية</button>
    </div>
  </div>`;
}

/* ============ BANK ============ */
function openBank(){state.view='bank';render();}
function renderBank(){
  let list=filterBank();
  return `<div class="topline"><button class="back-btn" onclick="goHome()">رجوع ${ICO.back}</button><div class="page-title">بنك الأسئلة (${DB.questions.length})</div></div>
  <div class="bank-toolbar">
    <input type="text" placeholder="ابحث في نص السؤال أو الإجابة..." value="${escapeHtml(state.bankSearch)}" oninput="state.bankSearch=this.value;renderBankList()">
    <select onchange="state.bankCat=this.value;renderBankList()">
      <option value="all">كل الفئات</option>
      ${DB.categories.map(c=>`<option value="${c.id}" ${state.bankCat===c.id?'selected':''}>${c.icon} ${escapeHtml(c.name)}</option>`).join('')}
    </select>
    <select onchange="state.bankDiff=this.value;renderBankList()">
      <option value="all">كل المستويات</option>
      <option value="easy" ${state.bankDiff==='easy'?'selected':''}>سهل</option>
      <option value="medium" ${state.bankDiff==='medium'?'selected':''}>متوسط</option>
      <option value="hard" ${state.bankDiff==='hard'?'selected':''}>صعب</option>
    </select>
  </div>
  <div class="bank-count" id="bank-count-label">عرض ${list.length} من أصل ${DB.questions.length} سؤال</div>
  <div class="bank-grid" id="bank-grid-container">${renderBankGrid(list)}</div>`;
}
function filterBank(){
  return DB.questions.filter(q=>{
    if(state.bankSearch&&!q.q.includes(state.bankSearch)&&!q.a.includes(state.bankSearch))return false;
    if(state.bankCat!=='all'&&q.cat!==state.bankCat)return false;
    if(state.bankDiff!=='all'&&q.diff!==state.bankDiff)return false;
    return true;
  });
}
function renderBankGrid(list){
  if(list.length===0)return `<div class="empty-state" style="grid-column:1/-1;">لا توجد أسئلة مطابقة للبحث</div>`;
  return list.map(q=>{
    const cat=DB.categories.find(c=>c.id===q.cat)||{name:'عام',icon:'❓'};
    const diffMeta=DIFF_META[q.diff];
    return `<div class="qcard">
      <button class="del" title="حذف السؤال" onclick="deleteQuestion('${q.id}')">🗑️</button>
      <div class="badges"><span class="badge cat">${cat.icon} ${escapeHtml(cat.name)}</span><span class="badge diff" style="border-color:${diffMeta.color};color:${diffMeta.color}">${diffMeta.label}</span></div>
      <div class="qq">${escapeHtml(q.q)}</div>
      <div class="aa-box">الإجابة: ${escapeHtml(q.a)}</div>
    </div>`;
  }).join('');
}
function renderBankList(){
  const list=filterBank();
  document.getElementById('bank-count-label').textContent=`عرض ${list.length} من أصل ${DB.questions.length} سؤال`;
  document.getElementById('bank-grid-container').innerHTML=renderBankGrid(list);
}
function deleteQuestion(id){
  DB.questions=DB.questions.filter(q=>q.id!==id);
  saveData(DB);state.toast='تم حذف السؤال بنجاح';renderBankList();
}

/* ============ ADD ============ */
function openAdd(){
  if(!state.addCat&&DB.categories.length>0)state.addCat=DB.categories[0].id;
  state.view='add';render();
}
function renderAdd(){
  return `<div class="topline"><button class="back-btn" onclick="goHome()">رجوع ${ICO.back}</button><div class="page-title">إضافة سؤال أو فئة جديدة</div></div>
  <div class="panel" style="max-width:700px;margin:0 auto 24px;">
    <div class="panel-title" style="margin-bottom:16px;">إضافة سؤال جديد للبنك</div>
    <form onsubmit="handleAddNewQuestion(event)">
      <div class="form-row">
        <select id="new-q-cat">${DB.categories.map(c=>`<option value="${c.id}">${c.icon} ${escapeHtml(c.name)}</option>`).join('')}</select>
        <div style="display:flex;gap:6px;flex:1;">
          ${['easy','medium','hard'].map(d=>`<div class="diff-choice ${state.addDiff===d?'sel':''}" onclick="selectDiff('${d}')" id="diff-opt-${d}" style="cursor:pointer;">${DIFF_META[d].label}</div>`).join('')}
        </div>
      </div>
      <div class="field"><textarea id="new-q-text" rows="3" placeholder="اكتب نص السؤال هنا..." required></textarea></div>
      <div class="field"><input type="text" id="new-q-ans" placeholder="الإجابة النموذجية..." required></div>
      <button type="submit" class="start-btn">إضافة السؤال للبنك</button>
    </form>
  </div>
  <div class="panel" style="max-width:700px;margin:0 auto;">
    <div class="panel-title" style="margin-bottom:16px;">إضافة فئة رئيسية جديدة</div>
    <div class="addcat-row"><input type="text" id="new-cat-name" placeholder="اسم الفئة الجديدة..."><button onclick="handleAddNewCategory()">إضافة فئة</button></div>
  </div>`;
}
function selectDiff(d){
  state.addDiff=d;
  document.querySelectorAll('.diff-choice').forEach(el=>el.classList.remove('sel'));
  const el=document.getElementById('diff-opt-'+d);
  if(el)el.classList.add('sel');
}
function handleAddNewQuestion(e){
  e.preventDefault();
  const cat=document.getElementById('new-q-cat').value;
  const qText=document.getElementById('new-q-text').value.trim();
  const aText=document.getElementById('new-q-ans').value.trim();
  if(!qText||!aText)return;
  DB.questions.push({id:uid(),cat,diff:state.addDiff,points:DIFF_META[state.addDiff].points,q:qText,a:aText});
  saveData(DB);state.toast='تمت إضافة السؤال بنجاح!';
  document.getElementById('new-q-text').value='';document.getElementById('new-q-ans').value='';
  render();
}
function handleAddNewCategory(){
  const nameInput=document.getElementById('new-cat-name');
  const name=nameInput.value.trim();
  if(!name)return;
  DB.categories.push({id:'cat_'+uid(),name,icon:'📁'});
  saveData(DB);state.toast='تمت إضافة الفئة بنجاح!';
  nameInput.value='';render();
}

/* ============ UTILS ============ */
function resetGame(){if(confirm('هل تريد إعادة بدء المسابقة من جديد؟')){beginGame();}}
function toggleFullscreen(){
  if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}
  else{if(document.exitFullscreen)document.exitFullscreen();}
}

/* ============ KEYBOARD ============ */
document.addEventListener('keydown',(e)=>{
  if(state.view!=='question')return;
  if(state.useMC){
    if(state.mcSelected===null){
      const idx=['1','2','3','4'].indexOf(e.key);
      if(idx>=0)selectMCChoice(idx);
    }else if(e.key==='Enter'){continueAfterMC();}
    return;
  }
  if(!state.showAnswer){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();revealAnswer();}
    if(e.key==='m'||e.key==='M'){e.preventDefault();startMC();}
    return;
  }
  if(e.key==='Enter'){e.preventDefault();judgeAnswer(true);}
  if(e.key==='Escape'){e.preventDefault();judgeAnswer(false);}
});

render();
</script>
</body>
</html>
